# ============================================================
# MÓDULO 7
# GITHUB ACTIONS + ROBOT FRAMEWORK + ALLURE
# ============================================================

name: Robot Tests - Allure


# ============================================================
# GATILHOS DO WORKFLOW
# ============================================================

on:

  # Execução manual pelo GitHub Actions
  workflow_dispatch:


  # Execução automática após push na main
  push:

    branches:

      - main

# ============================================================
# PERMISSÕES PARA GITHUB PAGES
# ============================================================

permissions:

  contents: read

  pages: write

  id-token: write

# ============================================================
# JOB PRINCIPAL
# ============================================================

jobs:

  robot-tests-allure:

    name: Robot Framework + Allure

    runs-on: ubuntu-latest


    # ========================================================
    # VARIÁVEIS DE AMBIENTE
    #
    # Os valores reais ficam nos GitHub Secrets.
    #
    # Nenhuma senha é gravada no código.
    # ========================================================

    env:

      BASE_URL: ${{ secrets.BASE_URL }}

      API_USERNAME: ${{ secrets.API_USERNAME }}

      API_PASSWORD: ${{ secrets.API_PASSWORD }}

      PIX_DESTINATARIO_USERNAME: ${{ secrets.PIX_DESTINATARIO_USERNAME }}

      PIX_DESTINATARIO_PASSWORD: ${{ secrets.PIX_DESTINATARIO_PASSWORD }}



    steps:


      # ======================================================
      # 1. CHECKOUT
      #
      # Baixa o código do projeto para o runner.
      # ======================================================

      - name: Checkout do projeto

        uses: actions/checkout@v6



      # ======================================================
      # 2. CONFIGURAR PYTHON
      #
      # Mantemos Python 3.9 porque é a versão utilizada
      # atualmente pelo projeto.
      # ======================================================

      - name: Configurar Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.9"



      # ======================================================
      # 3. INSTALAR DEPENDÊNCIAS PYTHON
      # ======================================================

      - name: Instalar dependências

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt



      # ======================================================
      # 4. VALIDAR VARIÁVEIS DE AMBIENTE
      #
      # Verificamos apenas se os Secrets existem.
      #
      # Os valores nunca são exibidos no log.
      # ======================================================

      - name: Validar variáveis de ambiente

        run: |

          echo "=========================================="

          echo "VALIDAÇÃO DAS VARIÁVEIS DE AMBIENTE"

          echo "=========================================="


          if [ -z "$BASE_URL" ]; then

            echo "ERRO: BASE_URL não configurada."

            exit 1

          fi


          if [ -z "$API_USERNAME" ]; then

            echo "ERRO: API_USERNAME não configurada."

            exit 1

          fi


          if [ -z "$API_PASSWORD" ]; then

            echo "ERRO: API_PASSWORD não configurada."

            exit 1

          fi


          if [ -z "$PIX_DESTINATARIO_USERNAME" ]; then

            echo "ERRO: PIX_DESTINATARIO_USERNAME não configurada."

            exit 1

          fi


          if [ -z "$PIX_DESTINATARIO_PASSWORD" ]; then

            echo "ERRO: PIX_DESTINATARIO_PASSWORD não configurada."

            exit 1

          fi


          echo ""

          echo "Todas as variáveis obrigatórias estão configuradas."



      # ======================================================
      # 5. INSTALAR JAVA
      #
      # O Allure Commandline necessita de Java.
      # ======================================================

      - name: Configurar Java

        uses: actions/setup-java@v5

        with:

          distribution: temurin

          java-version: "17"

      # ======================================================
      # 6. CONFIGURAR NODE.JS
      #
      # O Allure Commandline é instalado via npm.
      # Utilizamos Node.js 22 para evitar o warning
      # de depreciação do Node.js 20.
      # ======================================================

      - name: Configurar Node.js

        uses: actions/setup-node@v5

        with:

          node-version: "22"

      # ======================================================
      # 7. INSTALAR ALLURE COMMANDLINE
      #
      # Utilizamos a mesma versão que você utiliza localmente.
      #
      # Local:
      # allure --version
      # 2.43.0
      # ======================================================

      - name: Instalar Allure Commandline

        run: |

          npm install -g allure-commandline@2.43.0

          allure --version



      # ======================================================
      # 8. PREPARAR DIRETÓRIOS DO ALLURE
      #
      # O workflow começa sempre com um diretório limpo.
      # ======================================================

      - name: Preparar diretórios Allure

        run: |

          rm -rf output/allure

          rm -rf output/allure-report

          rm -rf results

          mkdir -p output/allure

          mkdir -p output/allure-report

          mkdir -p results

      # ======================================================
      # 9. RECUPERAR HISTÓRICO DO ALLURE
      #
      # Recupera o histórico da execução anterior.
      # ======================================================

      - name: Recuperar histórico do Allure

        uses: actions/cache/restore@v4

        with:

          path: output/allure-history

          key: allure-history-${{ github.ref_name }}

          restore-keys: |
            allure-history-${{ github.ref_name }}


      # ======================================================
      # 10. PREPARAR HISTÓRICO PARA O ALLURE
      #
      # O Allure espera o histórico dentro de:
      #
      # output/allure/history
      # ======================================================

      - name: Preparar histórico do Allure

        run: |

          mkdir -p output/allure/history

          if [ -d "output/allure-history" ]; then

            cp -R output/allure-history/. output/allure/history/

            echo "Histórico anterior encontrado."

          else

            echo "Nenhum histórico anterior encontrado."

          fi


      # ======================================================
      # 11. COPIAR CONFIGURAÇÕES DO ALLURE
      #
      # A configuração oficial fica em:
      #
      # config/allure/
      #
      # O diretório output/allure contém apenas os dados
      # necessários para aquela execução.
      # ======================================================

      - name: Preparar configuração do Allure

        run: |

          cp config/allure/categories.json output/allure/

          cp config/allure/environment.github.properties output/allure/environment.properties



      # ======================================================
      # 12. EXECUTAR ROBOT FRAMEWORK + ALLURE
      #
      # IMPORTANTE:
      #
      # Mesmo que existam falhas nos testes, continuamos para
      # gerar o relatório Allure.
      #
      # O código de retorno do Robot será armazenado.
      # ======================================================

      - name: Executar testes com Allure

        id: robot

        continue-on-error: true

        run: |

          robot \
            --listener allure_robotframework \
            --outputdir results \
            tests


      # ======================================================
      # 13. VALIDAR EXECUÇÃO ATUAL DO ROBOT
      # ======================================================

      - name: Validar execução atual

        if: always()

        run: |

          echo "=========================================="

          echo "VALIDAÇÃO DA EXECUÇÃO ATUAL"

          echo "=========================================="

          echo ""

          echo "Data/hora do runner:"

          date

          echo ""

          echo "Arquivos de resultados Robot:"

          find results -type f | sort

          echo ""

          echo "Quantidade de arquivos Allure:"

          find output/allure -type f | wc -l

          echo ""

          echo "Quantidade de resultados Allure:"

          find output/allure -name "*-result.json" | wc -l

          echo ""

          echo "Arquivos de resultado Allure:"

          find output/allure -name "*-result.json" | sort


      - name: Executar testes com Allure

        id: robot

        continue-on-error: true

        run: |

          echo "=========================================="

          echo "INÍCIO DOS TESTES ROBOT"

          echo "=========================================="

          date

          echo ""

          robot \
            --listener allure_robotframework \
            --outputdir results \
            tests

          ROBOT_EXIT_CODE=$?

          echo ""

          echo "=========================================="

          echo "FIM DOS TESTES ROBOT"

          echo "=========================================="

          date

          echo ""

          echo "Código de retorno Robot: $ROBOT_EXIT_CODE"

          exit $ROBOT_EXIT_CODE

      # ======================================================
      # 13. GERAR EXECUTOR.JSON
      #
      # Identifica a execução dentro do relatório Allure.
      # ======================================================

      - name: Criar executor.json

        run: |

          cat > output/allure/executor.json <<EOF

          {

            "buildName": "SimulaBank Automation",

            "name": "GitHub Actions",

            "reportName": "SimulaBank - GitHub Actions #${{ github.run_number }}",

            "type": "github",

            "buildOrder": ${{ github.run_number }},

            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          }

          EOF



      # ======================================================
      # 14. VERIFICAR RESULTADOS DO ALLURE
      # ======================================================

      - name: Verificar resultados Allure

        if: always()

        run: |

          echo "=========================================="

          echo "RESULTADOS ALLURE"

          echo "=========================================="


          echo ""

          echo "Arquivos encontrados:"


          find output/allure -maxdepth 1 -type f | sort


          echo ""

          echo "Quantidade de resultados:"


          find output/allure -name "*-result.json" | wc -l



      # ======================================================
      # 15. GERAR RELATÓRIO HTML
      #
      # O Allure transforma os resultados JSON em um
      # relatório navegável.
      # ======================================================

      - name: Gerar relatório Allure

        if: always()

        run: |

          allure generate \
            output/allure \
            -o output/allure-report \
            --clean

      # ======================================================
      # 16. SALVAR NOVO HISTÓRICO DO ALLURE
      # ======================================================

      - name: Atualizar histórico do Allure

        if: always()

        run: |

          rm -rf output/allure-history

          mkdir -p output/allure-history

          if [ -d "output/allure-report/history" ]; then

            cp -R output/allure-report/history/. output/allure-history/

            echo "Histórico do Allure atualizado."

          else

            echo "Nenhum histórico foi gerado."

          fi

      # ======================================================
      # 17. SALVAR HISTÓRICO NO CACHE
      # ======================================================

      - name: Salvar histórico do Allure

        if: always()

        uses: actions/cache/save@v4

        with:

          path: output/allure-history

          key: allure-history-${{ github.ref_name }}

          

      - name: Upload histórico Allure

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: allure-history

          path: output/allure-history/

          if-no-files-found: warn


      # ======================================================
      # 18. VERIFICAR RELATÓRIO GERADO
      # ======================================================

      - name: Verificar relatório Allure

        if: always()

        run: |

          echo "=========================================="

          echo "RELATÓRIO ALLURE"

          echo "=========================================="


          if [ -f "output/allure-report/index.html" ]; then

            echo "Relatório Allure gerado com sucesso."

            echo "Arquivo principal:"

            echo "output/allure-report/index.html"

          else

            echo "ERRO: relatório Allure não foi gerado."

            exit 1

          fi

      # ======================================================
      # 19. CONFIGURAR GITHUB PAGES
      # ======================================================

      - name: Configurar GitHub Pages

        if: always()

        uses: actions/configure-pages@v5

      # ======================================================
      # 20. PUBLICAR RESULTADOS TRADICIONAIS DO ROBOT
      # ======================================================

      - name: Upload relatórios Robot

        if: always()

        uses: actions/upload-artifact@v6

        with:

          name: robot-results-allure-pipeline

          path: results/

          if-no-files-found: warn



      # ======================================================
      # 21. PUBLICAR RESULTADOS BRUTOS DO ALLURE
      #
      # Úteis para diagnóstico e para futuras etapas
      # de histórico.
      # ======================================================

      - name: Upload resultados Allure

        if: always()

        uses: actions/upload-artifact@v6

        with:

          name: allure-results

          path: output/allure/

          if-no-files-found: warn



      # ======================================================
      # 22. PUBLICAR RELATÓRIO HTML DO ALLURE
      #
      # Este é o artefato que você poderá baixar e abrir
      # localmente.
      # ======================================================

      - name: Upload relatório Allure

        if: always()

        uses: actions/upload-artifact@v6

        with:

          name: allure-report

          path: output/allure-report/

          if-no-files-found: error

      # ======================================================
      # 23. PREPARAR RELATÓRIO ALLURE PARA GITHUB PAGES
      # ======================================================

      - name: Upload Allure para GitHub Pages

        if: always()

        uses: actions/upload-pages-artifact@v4

        with:

          path: output/allure-report

      # ======================================================
      # 24. FINALIZAR COM O STATUS REAL DOS TESTES
      #
      # O relatório já foi gerado.
      #
      # Agora fazemos o workflow refletir o resultado
      # real do Robot Framework.
      # ======================================================

      - name: Finalizar execução

        if: always()

        run: |

          if [ "${{ steps.robot.outcome }}" != "success" ]; then

            echo "=========================================="

            echo "TESTES ROBOT FINALIZADOS COM FALHA"

            echo "=========================================="

            exit 1

          fi


          echo "=========================================="

          echo "TESTES ROBOT EXECUTADOS COM SUCESSO"

          echo "=========================================="


  deploy-pages:

    name: Publicar Allure no GitHub Pages

    runs-on: ubuntu-latest

    needs: robot-tests-allure

    if: always()

    permissions:

      pages: write

      id-token: write

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Publicar Allure

        id: deployment

        uses: actions/deploy-pages@v4          