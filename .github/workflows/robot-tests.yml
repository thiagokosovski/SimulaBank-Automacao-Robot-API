name: Robot Framework Tests API


on:

  push:
    branches:
      - main


  pull_request:
    branches:
      - main


  workflow_dispatch:



env:

  BASE_URL: ${{ secrets.BASE_URL }}
  API_USERNAME: ${{ secrets.API_USERNAME }}
  API_PASSWORD: ${{ secrets.API_PASSWORD }}




jobs:


  robot-tests:


    name: Execute Robot Framework Tests


    runs-on: ubuntu-latest



    steps:



      - name: Checkout repository

        uses: actions/checkout@v4




      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.9"




      - name: Show environment information

        run: |

          echo "====================================="

          echo "Python version"

          echo "====================================="

          python --version


          echo ""

          echo "====================================="

          echo "Repository files"

          echo "====================================="

          ls -la


          echo ""

          echo "====================================="

          echo "Tests directory"

          echo "====================================="

          ls -la tests || true




      - name: Install dependencies

        run: |

          echo "Installing dependencies..."

          python -m pip install --upgrade pip

          pip install -r requirements.txt




      - name: Validate environment variables

        run: |

          echo "Checking environment variables..."


          if [ -z "$BASE_URL" ]; then
            echo "ERROR: BASE_URL is empty"
            exit 1
          fi


          if [ -z "$API_USERNAME" ]; then
            echo "ERROR: API_USERNAME is empty"
            exit 1
          fi


          if [ -z "$API_PASSWORD" ]; then
            echo "ERROR: API_PASSWORD is empty"
            exit 1
          fi


          echo "BASE_URL configured"

          echo "API_USERNAME configured"

          echo "API_PASSWORD configured"




      - name: Execute Robot Framework

        continue-on-error: true

        run: |

          rm -rf results

          python tools/run_robot.py



      - name: Publish Robot Summary

        if: always()

        run: |

          echo "Searching latest summary.md"


          SUMMARY=$(find results -name summary.md | sort | tail -1)


          echo "Summary found:"
          echo "$SUMMARY"


          if [ -f "$SUMMARY" ]; then

            echo "Publishing summary..."

            cat "$SUMMARY" >> $GITHUB_STEP_SUMMARY


          else

            echo "summary.md not found"

            exit 1

          fi




      - name: Upload Robot Reports

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: robot-results

          path: results/